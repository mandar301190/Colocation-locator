<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocation Locator - AWS Partners</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌐 Colocation Locator</h1>
            <p>Find AWS Partner Colocation Facilities Worldwide</p>
        </header>

        <div class="controls">
            <div class="filter-group">
                <label for="provider-select">Provider:</label>
                <select id="provider-select">
                    <option value="">All Providers</option>
                    <option value="megaport">Megaport</option>
                    <option value="equinix">Equinix</option>
                    <option value="1111systems">11:11 Systems</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="region-select">Region:</label>
                <select id="region-select">
                    <option value="">All Regions</option>
                    <option value="North America">North America</option>
                    <option value="EMEA">EMEA</option>
                    <option value="APJ">APJ</option>
                    <option value="South America">South America</option>
                    <option value="South Africa">South Africa</option>
                </select>
            </div>

            <div class="filter-group">
                <button id="refresh-data" class="refresh-btn">🔄 Refresh Data</button>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>

        <div id="nearest-locations-list" class="nearest-locations-section" style="display: none;">
            <!-- Nearest locations will be displayed here when user clicks on map -->
        </div>

        <div class="locations-section">
            <h3>📍 All Locations (<span id="filtered-locations">0</span> of <span id="total-locations">0</span>)</h3>
            <p class="locations-subtitle">Click any location to view on map</p>
            <div class="table-container">
                <table id="locations-table" class="locations-table">
                    <thead>
                        <tr>
                            <th>Colocation Name</th>
                            <th>Map Link</th>
                            <th>Country</th>
                            <th>Continent</th>
                        </tr>
                    </thead>
                    <tbody id="locations-container">
                        <tr>
                            <td colspan="4" class="loading">Loading locations...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="footer">
            <p>Data sourced from PeeringDB and DataCenters.com | Updated weekly</p>
            <p class="last-updated">Last updated: <span id="last-update">Loading...</span></p>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
