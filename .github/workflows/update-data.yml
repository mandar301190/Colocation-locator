name: Update Colocation Data

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'src/package.json'
        
    - name: Install dependencies
      working-directory: ./src
      run: |
        echo "Installing dependencies..."
        npm ci || npm install
        echo "Dependencies installed successfully"
        
    - name: Verify directories
      working-directory: ./src
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing files:"
        ls -la
        echo "Checking if update-data.js exists:"
        test -f update-data.js && echo "✓ update-data.js found" || echo "✗ update-data.js not found"
        
    - name: Update data
      working-directory: ./src
      run: |
        echo "Running data update script..."
        node update-data.js
        echo "Data update script completed"
        
    - name: Check for changes
      id: check_changes
      run: |
        git status
        if [[ -n $(git status -s) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
        
    - name: Commit and push changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add src/data/ docs/data/
        git commit -m "Auto-update colocation data - $(date +'%Y-%m-%d %H:%M:%S UTC')" || echo "Nothing to commit"
        git push origin main || echo "Nothing to push"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}